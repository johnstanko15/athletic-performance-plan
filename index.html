<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Athletic Performance Tracker</title>
<link rel="manifest" href="manifest.json">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#f4f5f7}
body{margin:0}.app{max-width:900px;margin:auto;padding:16px 16px 90px}
header{position:sticky;top:0;background:rgba(244,245,247,.95);backdrop-filter:blur(8px);padding:10px 0;z-index:2}
h1{font-size:24px;margin:0 0 10px}.tabs,.days{display:flex;gap:8px;overflow:auto;padding-bottom:8px}
button{border:0;border-radius:10px;padding:10px 12px;background:#fff;box-shadow:0 1px 4px #0001;font-weight:600}
button.active{background:#111;color:#fff}.card{background:#fff;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 2px 10px #0001}
.row{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid #eee}
.row:last-child{border-bottom:0}.exercise{font-weight:700}.meta{font-size:14px;color:#555;margin-top:3px}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
input{width:100%;box-sizing:border-box;padding:9px;border:1px solid #ccc;border-radius:8px;font-size:16px}
a{display:inline-block;margin-top:8px;font-size:14px}.section{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#666;margin-bottom:3px}
.progress{font-size:14px;color:#444}.footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:10px;text-align:center}
.small{font-size:12px;color:#666}
</style>
</head>

   const saved=JSON.parse(localStorage.getItem(key(i))||'{}'); if(saved.done)done++;
   const div=document.createElement('div');div.className='card row';
   div.innerHTML=`<input type="checkbox" ${saved.done?'checked':''}>
   <div><div class="section">${it.section}</div><div class="exercise">${it.exercise}</div>
   <div class="meta">${it.prescription}</div>
   <div class="inputs"><input placeholder="Weight / resistance" value="${saved.weight||''}"><input placeholder="Reps / time / notes" value="${saved.notes||''}"></div>
   <a href="${it.video}" target="_blank" rel="noopener">Watch concise demo search</a></div>`;
   const [cb,wi,ni]=[div.querySelector('input[type=checkbox]'),...div.querySelectorAll('.inputs input')];
   const save=()=>{localStorage.setItem(key(i),JSON.stringify({done:cb.checked,weight:wi.value,notes:ni.value}));renderProgress()};
   cb.onchange=save;wi.oninput=save;ni.oninput=save;c.appendChild(div)
 });
 renderProgress();
}
function renderProgress(){
 const day=PROGRAM[weekIndex].days[dayIndex];let done=0;
 day.items.forEach((_,i)=>{if(JSON.parse(localStorage.getItem(key(i))||'{}').done)done++});
 document.getElementById('progress').textContent=`${done} of ${day.items.length} movements complete`;
}
function resetDay(){if(confirm('Clear all entries for this day?')){PROGRAM[weekIndex].days[dayIndex].items.forEach((_,i)=>localStorage.removeItem(key(i)));render()}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
render();
</script></body></html>
