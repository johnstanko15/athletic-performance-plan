<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Athletic Performance Tracker</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#17202a;
  background:#f3f5f7;
  --warm:#e8f4f2; --warm-line:#2a7f75;
  --power:#f0eafa; --power-line:#7551a8;
  --main:#e7f0fb; --main-line:#356fa8;
  --accessory:#fff3df; --accessory-line:#b47719;
  --conditioning:#fdeaea; --conditioning-line:#b54b4b;
  --core:#eaf5e7; --core-line:#4c8a45;
  --grip:#edf0f3; --grip-line:#596575;
  --recovery:#f0f0f0; --recovery-line:#777;
}
*{box-sizing:border-box}
body{margin:0;background:#f3f5f7}
.app{max-width:980px;margin:auto;padding:14px 14px 96px}
header{
  position:sticky;top:0;z-index:5;padding:10px 0 8px;
  background:rgba(243,245,247,.96);backdrop-filter:blur(10px)
}
h1{font-size:24px;margin:0 0 8px}
h2{font-size:20px;margin:0}
.tabs,.days{display:flex;gap:8px;overflow-x:auto;padding:3px 0 8px}
button{
  border:0;border-radius:10px;padding:10px 12px;background:#fff;
  box-shadow:0 1px 4px #0001;font-weight:650;white-space:nowrap;color:#17202a
}
button.active{background:#17202a;color:#fff}
.summary{
  background:#fff;border-radius:14px;padding:14px;margin:8px 0 12px;
  box-shadow:0 2px 10px #0001
}
.day-note{font-size:14px;color:#59636e;margin-top:6px;line-height:1.35}
.progress{font-size:14px;color:#45505c;margin-top:8px}
.group{
  border-radius:14px;margin:12px 0;overflow:hidden;background:#fff;
  box-shadow:0 2px 10px #0001;border-left:7px solid var(--group-line)
}
.group-header{
  display:flex;justify-content:space-between;gap:10px;align-items:center;
  padding:11px 14px;background:var(--group-bg)
}
.group-title{font-size:15px;font-weight:750}
.group-count{font-size:12px;color:#59636e}
.exercise-row{
  display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;
  align-items:start;padding:13px 14px;border-top:1px solid #edf0f2
}
.exercise-row:first-of-type{border-top:0}
.exercise{font-weight:750}
.meta{font-size:14px;color:#59636e;margin-top:3px;line-height:1.35}
.original-section{
  display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
  color:#68727e;margin-top:5px
}
.weight-title{font-size:12px;font-weight:700;color:#59636e;margin-top:10px}
.weight-grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:5px
}
.field label{display:block;font-size:12px;color:#59636e;margin-bottom:3px}
input[type="text"]{
  width:100%;padding:9px;border:1px solid #cbd1d7;border-radius:8px;
  font-size:16px;background:#fff
}
.notes{margin-top:8px}
.demo-link{
  display:inline-block;margin-top:9px;font-size:14px;font-weight:650;
  color:#245f9a;text-decoration:none
}
.demo-link:hover{text-decoration:underline}
.warm{--group-bg:var(--warm);--group-line:var(--warm-line)}
.power{--group-bg:var(--power);--group-line:var(--power-line)}
.main{--group-bg:var(--main);--group-line:var(--main-line)}
.accessory{--group-bg:var(--accessory);--group-line:var(--accessory-line)}
.conditioning{--group-bg:var(--conditioning);--group-line:var(--conditioning-line)}
.core{--group-bg:var(--core);--group-line:var(--core-line)}
.grip{--group-bg:var(--grip);--group-line:var(--grip-line)}
.recovery{--group-bg:var(--recovery);--group-line:var(--recovery-line)}
.footer{
  position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #d9dee3;
  padding:10px;text-align:center;z-index:6
}
.small{font-size:12px;color:#66717d;margin-left:6px}
@media(max-width:480px){
  .app{padding-left:10px;padding-right:10px}
  h1{font-size:21px}
  .weight-grid{gap:5px}
  input[type="text"]{padding:8px 6px}
  .exercise-row{padding:12px 10px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Athletic Performance Tracker</h1>
    <div class="tabs" id="weeks"></div>
    <div class="days" id="days"></div>
    <div class="progress" id="progress"></div>
  </header>
  <div id="content"></div>
</div>
<div class="footer">
  <button type="button" id="resetButton">Reset current day</button>
  <span class="small">Logs save on this device.</span>
</div>

ise": "Fat-grip hold", "prescription": "3×30 sec", "video": "https://www.youtube.com/results?search_query=Fat-grip+hold+exercise+tutorial+concise"}, {"group": "Core", "section": "Core", "exercise": "Hanging knee raise", "prescription": "3×12", "video": "https://www.youtube.com/results?search_query=Hanging+knee+raise+exercise+tutorial+concise"}]}, {"name": "Day 6 – Speed, Agility + Conditioning", "items": [{"group": "Warm-up & Mobility", "section": "Warm-up & Mobility", "exercise": "Easy jog or bike", "prescription": "2 min", "video": "https://www.youtube.com/results?search_query=Easy+jog+or+bike+exercise+tutorial+concise"}, {"group": "Warm-up & Mobility", "section": "Warm-up & Mobility", "exercise": "A-skip", "prescription": "2×15 yd", "video": "https://www.youtube.com/results?search_query=A-skip+exercise+tutorial+concise"}, {"group": "Warm-up & Mobility", "section": "Warm-up & Mobility", "exercise": "High knees", "prescription": "2×15 yd", "video": "https://www.youtube.com/results?search_query=High+knees+exercise+tutorial+concise"}, {"group": "Warm-up & Mobility", "section": "Warm-up & Mobility", "exercise": "Carioca", "prescription": "2×15 yd", "video": "https://www.youtube.com/results?search_query=Carioca+exercise+tutorial+concise"}, {"group": "Warm-up & Mobility", "section": "Warm-up & Mobility", "exercise": "Walking hamstring sweep", "prescription": "8/leg", "video": "https://www.youtube.com/results?search_query=Walking+hamstring+sweep+exercise+tutorial+concise"}, {"group": "Power & Speed", "section": "Power & Speed", "exercise": "10-yard start", "prescription": "3 reps", "video": "https://www.youtube.com/results?search_query=10-yard+start+exercise+tutorial+concise"}, {"group": "Power & Speed", "section": "Power & Speed", "exercise": "30-yard sprint", "prescription": "4 reps", "video": "https://www.youtube.com/results?search_query=30-yard+sprint+exercise+tutorial+concise"}, {"group": "Power & Speed", "section": "Power & Speed", "exercise": "Flying 20", "prescription": "3 reps", "video": "https://www.youtube.com/results?search_query=Flying+20+exercise+tutorial+concise"}, {"group": "Power & Speed", "section": "Power & Speed", "exercise": "T-drill", "prescription": "4 reps", "video": "https://www.youtube.com/results?search_query=T-drill+exercise+tutorial+concise"}, {"group": "Conditioning", "section": "Conditioning", "exercise": "Assault bike interval", "prescription": "8×20 sec hard / 70 sec easy", "video": "https://www.youtube.com/results?search_query=Assault+bike+interval+exercise+tutorial+concise"}, {"group": "Accessory", "section": "Accessory", "exercise": "Single-leg calf raise", "prescription": "3×15/side", "video": "https://www.youtube.com/results?search_query=Single-leg+calf+raise+exercise+tutorial+concise"}, {"group": "Accessory", "section": "Accessory", "exercise": "Tibialis raise", "prescription": "3×20", "video": "https://www.youtube.com/results?search_query=Tibialis+raise+exercise+tutorial+concise"}, {"group": "Core", "section": "Core", "exercise": "Half-kneeling cable lift", "prescription": "3×10/side", "video": "https://www.youtube.com/results?search_query=Half-kneeling+cable+lift+exercise+tutorial+concise"}, {"group": "Grip, Traps & Neck", "section": "Grip, Traps & Neck", "exercise": "Suitcase carry", "prescription": "3×40 yd/side", "video": "https://www.youtube.com/results?search_query=Suitcase+carry+exercise+tutorial+concise"}, {"group": "Grip, Traps & Neck", "section": "Grip, Traps & Neck", "exercise": "Neck circuit", "prescription": "2 rounds", "video": "https://www.youtube.com/results?search_query=Neck+circuit+exercise+tutorial+concise"}]}, {"name": "Day 7 – Recovery", "items": [{"group": "Recovery", "section": "Recovery", "exercise": "Easy walk", "prescription": "20–30 min", "video": "https://www.youtube.com/results?search_query=Easy+walk+exercise+tutorial+concise"}, {"group": "Warm-up & Mobility", "section": "Warm-up & Mobility", "exercise": "Couch stretch", "prescription": "45 sec/side", "video": "https://www.youtube.com/results?search_query=Couch+stretch+exercise+tutorial+concise"}, {"group": "Warm-up & Mobility", "section": "Warm-up & Mobility", "exercise": "Adductor rock-back", "prescription": "10/side", "video": "https://www.youtube.com/results?search_query=Adductor+rock-back+exercise+tutorial+concise"}, {"group": "Warm-up & Mobility", "section": "Warm-up & Mobility", "exercise": "Thoracic rotation", "prescription": "8/side", "video": "https://www.youtube.com/results?search_query=Thoracic+rotation+exercise+tutorial+concise"}, {"group": "Warm-up & Mobility", "section": "Warm-up & Mobility", "exercise": "Doorway pec stretch", "prescription": "45 sec/side", "video": "https://www.youtube.com/results?search_query=Doorway+pec+stretch+exercise+tutorial+concise"}, {"group": "Recovery", "section": "Recovery", "exercise": "Light reverse hyperextension", "prescription": "2×15", "video": "https://www.youtube.com/results?search_query=Light+reverse+hyperextension+exercise+tutorial+concise"}]}]}];

const GROUP_ORDER = [
  "Warm-up & Mobility",
  "Power & Speed",
  "Main Lifts",
  "Accessory",
  "Conditioning",
  "Core",
  "Grip, Traps & Neck",
  "Recovery"
];

const GROUP_CLASS = {
  "Warm-up & Mobility":"warm",
  "Power & Speed":"power",
  "Main Lifts":"main",
  "Accessory":"accessory",
  "Conditioning":"conditioning",
  "Core":"core",
  "Grip, Traps & Neck":"grip",
  "Recovery":"recovery"
};

let weekIndex = 0;
let dayIndex = 0;

const storageKey = (itemIndex) => `apt-${weekIndex}-${dayIndex}-${itemIndex}`;

function inferGroup(item){
  if(item.group) return item.group;
  const section = (item.section || "").toLowerCase();
  const exercise = (item.exercise || "").toLowerCase();

  if(section.includes("recovery")) return "Recovery";
  if(section.includes("conditioning")) return "Conditioning";
  if(section.includes("power") || section.includes("speed") || section.includes("agility")) return "Power & Speed";
  if(section.includes("strength")) return "Main Lifts";
  if(section.includes("rotational core")) return "Core";

  const coreWords = ["ab wheel","plank","pallof","woodchop","cable chop","cable lift",
    "leg raise","knee raise","curl-up","bird dog","dead bug","rotation","copenhagen"];
  if(coreWords.some(word => exercise.includes(word))) return "Core";

  const gripWords = ["neck","shrug","dead hang","towel hang","pinch","grip","farmer carry",
    "static hold","trap-bar carry","kettlebell carry","fat-grip"];
  if(gripWords.some(word => exercise.includes(word))) return "Grip, Traps & Neck";

  if(section.includes("core") && exercise.includes("suitcase carry")) return "Core";
  if(section.includes("grip") || section.includes("traps") || section.includes("neck")) return "Grip, Traps & Neck";
  if(section.includes("hypertrophy") || section.includes("posterior chain")) return "Accessory";
  if(section.includes("warm") || section.includes("mobility") || section.includes("activation") ||
     section.includes("technique") || section.includes("optional")) return "Warm-up & Mobility";
  return "Accessory";
}

function readSaved(itemIndex){
  const raw = JSON.parse(localStorage.getItem(storageKey(itemIndex)) || "{}");
  return {
    done: Boolean(raw.done),
    john: raw.john ?? raw.weight ?? "",
    mike: raw.mike ?? "",
    greg: raw.greg ?? "",
    notes: raw.notes ?? ""
  };
}

function writeSaved(itemIndex, values){
  localStorage.setItem(storageKey(itemIndex), JSON.stringify(values));
}

function render(){
  const weekTabs = document.getElementById("weeks");
  weekTabs.innerHTML = "";
  PROGRAM.forEach((week, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = week.name;
    button.className = index === weekIndex ? "active" : "";
    button.addEventListener("click", () => {
      weekIndex = index;
      dayIndex = 0;
      render();
    });
    weekTabs.appendChild(button);
  });

  const dayTabs = document.getElementById("days");
  dayTabs.innerHTML = "";
  PROGRAM[weekIndex].days.forEach((day, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = `Day ${index + 1}`;
    button.className = index === dayIndex ? "active" : "";
    button.addEventListener("click", () => {
      dayIndex = index;
      render();
    });
    dayTabs.appendChild(button);
  });

  const week = PROGRAM[weekIndex];
  const day = week.days[dayIndex];
  const content = document.getElementById("content");
  content.innerHTML = "";

  const summary = document.createElement("div");
  summary.className = "summary";
  summary.innerHTML = `<h2>${day.name}</h2>${week.note ? `<div class="day-note">${week.note}</div>` : ""}`;
  content.appendChild(summary);

  const grouped = {};
  day.items.forEach((entry, originalIndex) => {
    const group = inferGroup(entry);
    if(!grouped[group]) grouped[group] = [];
    grouped[group].push({entry, originalIndex});
  });

  GROUP_ORDER.forEach(groupName => {
    const entries = grouped[groupName];
    if(!entries || entries.length === 0) return;

    const section = document.createElement("section");
    section.className = `group ${GROUP_CLASS[groupName] || "accessory"}`;

    const completed = entries.filter(({originalIndex}) => readSaved(originalIndex).done).length;
    const header = document.createElement("div");
    header.className = "group-header";
    header.innerHTML = `<div class="group-title">${groupName}</div>
      <div class="group-count">${completed}/${entries.length} complete</div>`;
    section.appendChild(header);

    entries.forEach(({entry, originalIndex}) => {
      const saved = readSaved(originalIndex);
      const row = document.createElement("div");
      row.className = "exercise-row";
      row.innerHTML = `
        <input type="checkbox" aria-label="Complete ${entry.exercise}" ${saved.done ? "checked" : ""}>
        <div>
          <div class="exercise">${entry.exercise}</div>
          <div class="meta">${entry.prescription}</div>
          ${entry.section && entry.section !== groupName ? `<div class="original-section">${entry.section}</div>` : ""}
          <div class="weight-title">Weight / resistance</div>
          <div class="weight-grid">
            <div class="field"><label>John</label><input type="text" inputmode="decimal" value="${escapeHtml(saved.john)}"></div>
            <div class="field"><label>Mike</label><input type="text" inputmode="decimal" value="${escapeHtml(saved.mike)}"></div>
            <div class="field"><label>Greg</label><input type="text" inputmode="decimal" value="${escapeHtml(saved.greg)}"></div>
          </div>
          <div class="field notes"><label>Reps, time or notes</label><input type="text" value="${escapeHtml(saved.notes)}"></div>
          <a class="demo-link" href="${entry.video}" target="_blank" rel="noopener">Watch movement video</a>
        </div>`;

      const checkbox = row.querySelector('input[type="checkbox"]');
      const textInputs = row.querySelectorAll('input[type="text"]');
      const [johnInput, mikeInput, gregInput, notesInput] = textInputs;

      const save = () => {
        writeSaved(originalIndex, {
          done: checkbox.checked,
          john: johnInput.value,
          mike: mikeInput.value,
          greg: gregInput.value,
          notes: notesInput.value
        });
        renderProgress();
        updateGroupCounts();
      };

      checkbox.addEventListener("change", save);
      textInputs.forEach(input => input.addEventListener("input", save));
      section.appendChild(row);
    });

    content.appendChild(section);
  });

  renderProgress();
}

function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll('"',"&quot;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}

function renderProgress(){
  const day = PROGRAM[weekIndex].days[dayIndex];
  const completed = day.items.reduce((sum, _, index) => sum + (readSaved(index).done ? 1 : 0), 0);
  document.getElementById("progress").textContent =
    `${completed} of ${day.items.length} movements complete`;
}

function updateGroupCounts(){
  const day = PROGRAM[weekIndex].days[dayIndex];
  const counts = {};
  day.items.forEach((entry, index) => {
    const group = inferGroup(entry);
    if(!counts[group]) counts[group] = {done:0,total:0};
    counts[group].total += 1;
    if(readSaved(index).done) counts[group].done += 1;
  });

  document.querySelectorAll(".group").forEach(groupElement => {
    const title = groupElement.querySelector(".group-title").textContent;
    const count = counts[title];
    if(count) groupElement.querySelector(".group-count").textContent = `${count.done}/${count.total} complete`;
  });
}

function resetDay(){
  if(confirm("Clear all entries for this day?")){
    PROGRAM[weekIndex].days[dayIndex].items.forEach((_, index) => {
      localStorage.removeItem(storageKey(index));
    });
    render();
  }
}

document.getElementById("resetButton").addEventListener("click", resetDay);

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js?v=3");
}

render();
</script>
